<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>EcoOils Mentari – PTW Registry</title>
<style>
:root{
  --ink:#1c2a1c; --ink2:#4d5d4d; --mute:#7b887b; --line:#d9ded6; --bg:#f3f5f1; --paper:#ffffff;
  --green:#4a9d2f; --green-d:#2f6b1c; --green-p:#e8f3e2; --yellow:#f6d94c; --yellow-p:#fff6c9;
  --red:#c62828; --red-p:#fde8e6; --amber:#b26a00; --amber-p:#fff0d6; --blue:#245a8d; --blue-p:#e4eef7;
  --radius:6px; --font:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--ink:#e7efe5;--ink2:#b5c3b2;--mute:#8a9988;--line:#34413a;--bg:#131a15;--paper:#1b251e;--green-p:#1f3321;--yellow-p:#3b3510;--red-p:#3d1b19;--amber-p:#3a2a0b;--blue-p:#17293a;--green:#6cc04a;--green-d:#8fd672}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
.spacer{flex:1}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--green-p);color:var(--green-d);white-space:nowrap}
header .chip{background:rgba(255,255,255,.18);color:#fff}
.chip.high,.chip.red{background:var(--red-p);color:var(--red)} .chip.warn,.chip.amber{background:var(--amber-p);color:var(--amber)} .chip.info,.chip.blue{background:var(--blue-p);color:var(--blue)} .chip.yellow{background:var(--yellow-p);color:#6b5a00} .chip.grey{background:var(--line);color:var(--ink2)}
.btn{border:1px solid var(--green-d);background:var(--green-d);color:#fff;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green-d);border-color:var(--line)} header .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.red{background:var(--red);border-color:var(--red)} .btn.small{padding:4px 10px;font-size:13px}
.testbar{background:var(--yellow);color:#4a3d00;text-align:center;font-weight:700;padding:6px;font-size:13px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:14px 0 0;border-bottom:2px solid var(--line)}
nav.tabs.sub{margin-top:8px;border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 14px;cursor:pointer;color:var(--ink2);font-weight:600}
nav.tabs button.on{color:var(--green-d);border-bottom-color:var(--green)}
nav.tabs.sub button{font-size:13px;padding:6px 11px;font-weight:500}
.navlabel{align-self:center;font-size:12px;color:var(--mute);padding:0 8px 0 2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.card h2{margin:0 0 4px;font-size:18px} .card h3{margin:18px 0 8px;font-size:14px;color:var(--green-d);border-bottom:1px solid var(--line);padding-bottom:4px}
.hint{color:var(--mute);font-size:13px;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.grid .wide{grid-column:1/-1}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:600} label.f .req{color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{width:100%;margin-top:3px;padding:8px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);min-height:38px}
textarea{min-height:70px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;cursor:pointer;font-size:14px}
.checks label:has(input:checked){background:var(--green-p);border-color:var(--green)}
.checks input{width:18px;height:18px;accent-color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.err{background:var(--red-p);border:1px solid var(--red);color:var(--red);border-radius:var(--radius);padding:10px 12px;margin-top:12px}
.err ul{margin:4px 0 0 18px;padding:0} .okbox{background:var(--green-p);border:1px solid var(--green);border-radius:var(--radius);padding:12px;margin-top:12px}
.warnbox{background:var(--amber-p);border:1px solid var(--amber);border-radius:var(--radius);padding:10px 12px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--radius);padding:10px 12px;cursor:pointer;text-align:left}
.kpi b{font-size:26px;display:block;line-height:1.1} .kpi span{font-size:12.5px;color:var(--ink2)}
.kpi.red{border-left-color:var(--red)} .kpi.amber{border-left-color:var(--amber)} .kpi.yellow{border-left-color:var(--yellow)} .kpi.grey{border-left-color:var(--mute)}
.bars{display:grid;gap:5px;margin-top:6px} .bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:14px;background:var(--green);border-radius:3px;min-width:2px}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--green-p);color:var(--green-d);position:sticky;top:0;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--yellow-p)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px}
.filters label{font-size:12px;color:var(--ink2);font-weight:600} .filters select,.filters input{margin-top:2px;min-width:130px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(720px,100%);background:var(--paper);border-left:3px solid var(--yellow);box-shadow:-10px 0 30px rgba(0,0,0,.25);overflow-y:auto;padding:16px;padding-bottom:60px;z-index:20}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:14px} .kv dt{color:var(--mute)} .kv dd{margin:0;word-break:break-word}
/* the matrix mirrors the paper Rev 001 form: days down the side, Day / Extended / Night across */
.matrix{border-collapse:separate;border-spacing:0;border:2px solid var(--ink);width:100%}
.matrix th{background:var(--paper);color:var(--ink);border:1px solid var(--ink);position:static;text-align:center}
.matrix td{border:1px solid var(--ink);text-align:center;min-width:110px;font-size:13px;height:54px;vertical-align:middle}
.matrix td.dn{font-weight:700;font-size:18px;width:54px}
.matrix td.have{background:var(--green-p)} .matrix td.have.bad{background:var(--amber-p)} .matrix td.missing{background:var(--red-p);color:var(--red);font-weight:600} .matrix td.na{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);color:var(--mute)}
.combo .combobox{position:relative} .combolist{position:absolute;left:0;right:0;top:100%;margin:2px 0 0;padding:4px 0;list-style:none;max-height:250px;overflow:auto;background:var(--paper);border:1px solid var(--green);border-radius:var(--radius);box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:15;font-weight:400;color:var(--ink)} .combolist li{padding:8px 11px;cursor:pointer} .combolist li.on,.combolist li:hover{background:var(--green-p)} .combolist li.other{border-top:1px solid var(--line);color:var(--amber);font-weight:600} [hidden]{display:none!important}
.checks label.locked{background:var(--yellow-p);border-color:var(--yellow);cursor:default}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.modal>div{background:var(--paper);border-radius:var(--radius);padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--yellow)}
.flaglist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px} .flaglist li{display:flex;gap:6px;align-items:flex-start}
.login{max-width:420px;margin:12vh auto 0}
.login .card{border-top:6px solid var(--yellow)}
.small{font-size:12.5px;color:var(--mute)}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.bar{grid-template-columns:70px 1fr 28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v1.2 – minimal Shell-style look, Jost, version above language toggle */
:root{--font:"Jost","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;--shell-red:#dd1d21;--shell-yellow:#fbce07;--grey:#6b6b6b}
.wrap{max-width:min(1600px,100%)}
.brand{font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:18px}
.brand small{letter-spacing:.12em;font-size:11px;opacity:1}
header .chip{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
header .btn.ghost{color:var(--ink2);border-color:var(--line)}
.btn{background:var(--shell-red);border-color:var(--shell-red)} .btn.ghost{background:transparent;color:var(--shell-red);border-color:var(--line)}
nav.tabs button.on{color:var(--shell-red);border-bottom-color:var(--shell-red)}
.login .brand{color:var(--grey)}
@media(min-width:1800px){html,body{font-size:16px}}
/* eco-std-header */
header.eh{background:#fff;color:#231f20;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid #dcdcdc;position:relative;z-index:5;margin:0;width:auto;max-width:none;height:auto;min-height:0;box-shadow:none;font-family:Jost,system-ui,Arial,sans-serif;font-size:16px;line-height:1.45}
header.eh .eh-logo{height:44px;width:auto;max-width:58%;object-fit:contain;display:block;margin:0}
header.eh .eh-r{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin-left:auto}
header.eh .eh-v{font-size:12px;letter-spacing:.08em;color:#6e6b6c;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:400;background:none;border:0}
header.eh .eh-d{font-size:11px;letter-spacing:.06em;color:#aaaaaa;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
header.eh .eh-l{display:flex;gap:0;margin:0;padding:0;background:none;border:0}
header.eh .eh-l button{background:none;color:#6e6b6c;border:0;border-bottom:3px solid transparent;border-radius:0;min-width:44px;min-height:44px;padding:0 8px;margin:0;font:400 15px/1 Jost,system-ui,Arial,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:none;opacity:1;text-transform:none}
header.eh .eh-l button.on,header.eh .eh-l button.active,header.eh .eh-l button[aria-pressed="true"]{color:#231f20;font-weight:600;border-bottom-color:#44a276;background:none}
@media(max-width:420px){header.eh .eh-l button{min-width:40px}}
/* v1.4 compact layout: title, role and log out share one slim row; content uses the full width */
.wrap{max-width:none;padding:0 16px 40px}
.titlebar{display:flex;align-items:center;gap:10px;padding:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--paper)}
.titlebar .brand{font-size:15px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.titlebar .brand small{display:inline;font-size:11px;margin:0;color:var(--mute)}
.titlebar .chip{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
nav.tabs{margin-top:8px} .card{margin-top:10px;padding:12px 14px} .kpis{margin-top:10px}
@media(min-width:1800px){.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
</style>
</head>
